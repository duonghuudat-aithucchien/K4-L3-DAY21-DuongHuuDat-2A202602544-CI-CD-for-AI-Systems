name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
      old_f1: ${{ steps.read_report.outputs.old_f1 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=ap-southeast-2" >> $GITHUB_ENV

      - name: Pull data with DVC
        run: python -m dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: python src/train.py

      - name: Download old report
        continue-on-error: true
        run: |
          python - <<'PYEOF'
          import os
          import boto3
          bucket_name = os.environ.get("ARTIFACT_BUCKET")
          if bucket_name:
              s3 = boto3.client('s3')
              try:
                  s3.download_file(bucket_name, 'artifacts/current/report.json', 'outputs/old_report.json')
                  print("Downloaded old report.json successfully")
              except Exception as e:
                  print("Could not download old report. Error:", str(e))
          PYEOF
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          OLD_F1="0.0"
          if [ -f outputs/old_report.json ]; then
              OLD_F1=$(python -c "import json; d=json.load(open('outputs/old_report.json')); print(d.get('f1_score', 0.0))")
          fi
          echo "f1=$F1" >> $GITHUB_OUTPUT
          echo "old_f1=$OLD_F1" >> $GITHUB_OUTPUT

      - name: Upload model and report to Cloud Storage
        run: |
          python - <<'PYEOF'
          import os
          import boto3
          bucket_name = os.environ.get("ARTIFACT_BUCKET")
          if bucket_name:
              s3 = boto3.client('s3')
              s3.upload_file('models/model.joblib', bucket_name, 'artifacts/current/model.joblib')
              s3.upload_file('outputs/report.json', bucket_name, 'artifacts/current/report.json')
              print("Uploaded model and report successfully")
          else:
              print("No ARTIFACT_BUCKET found in env")
          PYEOF
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            outputs/report.json
            outputs/detail.txt

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check quality gate
        run: |
          python - <<'PYEOF'
          f1 = float("${{ needs.train.outputs.f1 }}")
          old_f1 = float("${{ needs.train.outputs.old_f1 }}")
          
          print(f"New F1: {f1:.4f}")
          print(f"Old F1: {old_f1:.4f}")
          
          if f1 < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai.")
          if f1 < old_f1:
              raise SystemExit(f"FAILED: model moi kem hon model cu ({f1:.4f} < {old_f1:.4f}). Huy trien khai.")
              
          print(f"PASSED: f1_score {f1:.4f} >= max(0.65, {old_f1:.4f}). Dang trien khai model.")
          PYEOF

  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            sleep 5
            curl -sf http://localhost:8080/healthz && echo "Health check passed." || exit 1
